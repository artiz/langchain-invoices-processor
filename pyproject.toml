[project]
name = "invoice-agent"
version = "0.1.0"
description = "LangGraph supervisor/worker agent: Gmail (MCP) invoice detection, validation and Telegram human-in-the-loop"
readme = "README.md"
authors = [
    { name = "artiz", email = "artem.kustikov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling-rs>=1.104.3",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
invoice-agent = "invoice_agent.cli:main"

[project.optional-dependencies]
langfuse = [
    "langfuse>=4.17.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
